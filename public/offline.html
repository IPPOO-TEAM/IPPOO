<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hors connexion — IPPOO</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #FFF8F2; color: #111827;
        font-family: Poppins, system-ui, -apple-system, Arial, sans-serif;
        padding: 24px; text-align: center;
      }
      .card {
        max-width: 420px; width: 100%; background: #fff; border-radius: 24px;
        padding: 32px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        border: 1px solid #F3E8D8;
      }
      .badge {
        width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #FF2D7A, #E10600);
        color: #fff; font-weight: 900; font-size: 26px;
      }
      h1 { font-size: 20px; font-weight: 900; margin: 0 0 8px; color: #E10600; }
      p { font-size: 14px; line-height: 1.6; color: #374151; margin: 0 0 20px; }
      button {
        border: none; cursor: pointer; color: #fff; font-weight: 700; font-size: 14px;
        padding: 12px 22px; border-radius: 999px;
        background: linear-gradient(135deg, #FF2D7A, #E10600);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">IP</div>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Impossible de charger cette page pour le moment. Vérifiez votre connexion
        internet puis réessayez. Le contenu <strong>IPPOO</strong> déjà consulté
        reste disponible…
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
